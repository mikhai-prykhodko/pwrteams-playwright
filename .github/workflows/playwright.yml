name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    # need to add a self hosted runner for this workflow
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: yarn install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        BASE_URL: 'https://www.tui.nl/' 
        COUNTRY: NL
        WAIT_TIMEOUT: 30000
        RETRY_TIME: 3000
        GLOBAL_TIMEOUT: 240000
        CI: true
      run: yarn test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Deploy Playwright Report to Github Pages
      if: ${{ !cancelled() && github.event_name != 'pull_request' }}
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ github.token }}
        publish_branch: gh-pages
        publish_dir: playwright-report
        destination_dir: reports/${{ github.ref }}
    - name: Add Playwright report link to job summary
      if: ${{ !cancelled() }}
      run: |
        {
          echo "## Playwright report"
          echo ""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "HTML report is attached as the **playwright-report** artifact (download from this run)."
            echo ""
            echo "[Open this run → Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/reports/${{ github.ref }}/"
            echo "[**View HTML report on GitHub Pages**](${REPORT_URL})"
            echo ""
            echo "If the page is empty, wait a minute for Pages to publish after the \`gh-pages\` push."
            echo ""
            echo "You can also download **playwright-report** from [this run’s Artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
